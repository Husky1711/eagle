# Render.com Deployment Configuration
# This file defines how to deploy Eagle Logistics on Render

services:
  # Backend API Service
  - type: web
    name: eagle-logistics-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
    disk:
      name: eagle-logistics-storage
      mountPath: /opt/render/project/src/backend/storage
      sizeGB: 1

  # Frontend Static Site
  - type: web
    name: eagle-logistics-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: eagle-logistics-backend
          property: host

